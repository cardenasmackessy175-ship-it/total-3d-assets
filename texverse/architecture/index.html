for(let k=0;k<n;k++){const it=items[i++];const d=document.createElement('div');d.className='tile';
const u=IMG+'/'+it.p+'.webp';
if(it.v){const v=document.createElement('video');v.src=VID+'/'+it.p+'.mp4';v.poster=u;v.muted=true;v.loop=true;v.playsInline=true;v.preload='none';v.controls=true;d.appendChild(v);}
else{const im=document.createElement('img');im.loading='lazy';im.src=u;d.appendChild(im);}
grid.appendChild(d);}
if(i>=items.length){document.getElementById('end').style.display='block';observer.disconnect();}}
const observer=new IntersectionObserver(es=>{if(es[0].isIntersecting)add()},{rootMargin:'1200px'});
new IntersectionObserver(es=>{if(es[0].isIntersecting)add()},{rootMargin:'800px'}).observe(document.getElementById('end'));
add();add();
</script></body></html>
